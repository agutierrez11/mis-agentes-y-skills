        const grid = document.getElementById('skillsGrid');
        const searchInput = document.getElementById('searchInput');
        const categoryFilter = document.getElementById('categoryFilter');
        const totalCount = document.getElementById('totalCount');

        function renderSkills(data) {
            grid.innerHTML = '';
            totalCount.textContent = `${data.length} Skills Visibles`;
            
            if(data.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No se encontraron skills con esos criterios.</div>';
                return;
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <div class="card-category">${item.category}</div>
                        <div class="card-title">${item.name}</div>
                        <div class="card-desc">${item.description}</div>
                    </div>
                    <div class="card-footer" title="${item.path}">📂 ${item.name}/SKILL.md</div>
                `;
                grid.appendChild(card);
            });
        }

        function filterData() {
            const query = searchInput.value.toLowerCase();
            const cat = categoryFilter.value;

            const filtered = skills.filter(item => {
                const matchQuery = item.name.toLowerCase().includes(query) || item.description.toLowerCase().includes(query);
                const matchCat = cat === 'ALL' || item.category === cat;
                return matchQuery && matchCat;
            });

            renderSkills(filtered);
        }

        searchInput.addEventListener('input', filterData);
        categoryFilter.addEventListener('change', filterData);

        renderSkills(skills);
